<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام | CRYPTO PRO</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Tahoma, sans-serif;
            padding: 20px 0; /* برای موبایل که کارت به سقف نچسبد */
        }

        .register-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 35px;
            width: 100%;
            max-width: 450px; /* کمی پهن‌تر از لاگین برای فیلدهای بیشتر */
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .brand-logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fcd535;
            text-align: center;
            margin-bottom: 20px;
        }

        .form-control {
            background-color: #262626;
            border: 1px solid #444;
            color: white;
            padding: 12px;
            border-radius: 10px;
        }

        .form-control:focus {
            background-color: #2d2d2d;
            border-color: #fcd535;
            color: white;
            box-shadow: none;
        }

        .btn-register {
            background-color: #fcd535;
            color: #000;
            font-weight: bold;
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .btn-register:hover {
            background-color: #e5c02e;
            transform: translateY(-2px);
        }

        .login-link {
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: #888;
        }

        .login-link a {
            color: #fcd535;
            text-decoration: none;
        }

        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(252, 213, 53, 0.05);
            filter: blur(100px);
            border-radius: 50%;
            z-index: -1;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="register-card animate__animated animate__fadeInUp">
        <div class="brand-logo">
            CRYPTO <span style="color: #fff;">PRO</span>
        </div>

        <h4 class="text-center mb-4">ساخت حساب کاربری جدید</h4>

        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label small text-secondary">نام کامل</label>
                <input type="text" class="form-control" placeholder="نام و نام خانوادگی" required>
            </div>
            <div class="mb-3">
                <label class="form-label small text-secondary">ایمیل</label>
                <input type="email" class="form-control" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label small text-secondary">رمز عبور</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="mb-3">
                <label class="form-label small text-secondary">تکرار رمز عبور</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>
            
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="terms" required>
                <label class="form-check-label small text-secondary" for="terms">
                    موافقم با قوانین و مقررات سایت
                </label>
            </div>

            <button type="submit" class="btn btn-register">ثبت نام رایگان</button>
        </form>

        <div class="login-link">
            قبلاً ثبت‌نام کرده‌ای؟ <a href="login.html">وارد شو</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('محمد، ظاهر عالیه! حالا وقتشه بریم سراغ جنگو تا این اطلاعات رو واقعاً توی دیتابیس ذخیره کنیم. 🚀');
        });
    </script>
</body>
</html>
