<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به پنل | CRYPTO PRO</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <!-- Google Fonts (اگر فونت خاصی داری جایگزین کن) -->
    <style>
        body {
            background-color: #0f0f0f; /* مشکی عمیق */
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Tahoma, sans-serif; /* در پروژه واقعی حتما از فونت فارسی مثل Vazir استفاده کن */
            overflow: hidden;
        }

        .login-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .brand-logo {
            font-size: 2rem;
            font-weight: bold;
            color: #fcd535; /* همان رنگ طلایی سایتت */
            margin-bottom: 30px;
            text-align: center;
        }

        .form-control {
            background-color: #262626;
            border: 1px solid #444;
            color: white;
            padding: 12px;
            border-radius: 10px;
        }

        .form-control:focus {
            background-color: #2d2d2d;
            border-color: #fcd535;
            color: white;
            box-shadow: none;
        }

        .btn-login {
            background-color: #fcd535;
            color: #000;
            font-weight: bold;
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            background-color: #e5c02e;
            transform: translateY(-2px);
        }

        .login-footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.9rem;
            color: #888;
        }

        .login-footer a {
            color: #fcd535;
            text-decoration: none;
        }

        /* افکت نوری ملایم در پس‌زمینه */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(252, 213, 53, 0.05);
            filter: blur(100px);
            border-radius: 50%;
            z-index: -1;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="login-card animate__animated animate__fadeInDown">
        <div class="brand-logo animate__animated animate__pulse animate__infinite">
            CRYPTO <span style="color: #fff;">PRO</span>
        </div>

        <h4 class="text-center mb-4">خوش آمدید</h4>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label small text-secondary">ایمیل یا نام کاربری</label>
                <input type="text" class="form-control" placeholder="example@mail.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label small text-secondary">رمز عبور</label>
                <input type="password" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="d-flex justify-content-between small mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label text-secondary" for="rememberMe">مرا به خاطر بسپار</label>
                </div>
                <a href="#" class="text-secondary">فراموشی رمز؟</a>
            </div>
            <button type="submit" class="btn btn-login">ورود به حساب</button>
        </form>

        <div class="login-footer">
            هنوز عضو نشده‌ای؟ <a href="D:/Crypto_Web/crypto-landing/Front/register.html">ثبت نام کنید</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // این بخش فعلاً فقط برای تست انیمیشن و جلوگیری از رفرش صفحه است
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('محمد، این فقط فرانت‌اند بود! حالا باید بریم سراغ بک‌انند تا واقعاً کار کنه. 😉');
        });
    </script>
</body>
</html>
